name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps --no-build-isolation -e .

      - name: Run Ruff linter
        run: ruff check Data/data_download.py scripts/resolve_port.py src tests

      - name: Run Pytest suite with coverage
        run: pytest --cov=src --cov-report=term-missing -v

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run frontend unit tests, typecheck, and Vite build
        run: |
          npm --prefix frontend run test
          npm --prefix frontend run typecheck
          npm --prefix frontend run build

  docker-build:
    needs: [lint-and-test, frontend-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: house-price-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
