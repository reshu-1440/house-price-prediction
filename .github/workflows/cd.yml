name: CD Pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install and verify tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps --no-build-isolation -e .
          ruff check src tests
          pytest -v

      - name: Configure AWS credentials (when configured)
        if: ${{ vars.AWS_REGION != '' && secrets.AWS_DEPLOY_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build and push release image to ECR (when configured)
        if: ${{ vars.AWS_ECR_REPOSITORY != '' && secrets.AWS_DEPLOY_ROLE_ARN != '' }}
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" | docker login --username AWS --password-stdin "${{ vars.AWS_ECR_REGISTRY }}"
          docker build --target runtime -t "${{ vars.AWS_ECR_REGISTRY }}/${{ vars.AWS_ECR_REPOSITORY }}:${IMAGE_TAG}" .
          docker push "${{ vars.AWS_ECR_REGISTRY }}/${{ vars.AWS_ECR_REPOSITORY }}:${IMAGE_TAG}"
