[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra -q
markers =
    unit: Fast isolated unit tests
    integration: Integration tests covering API and training flows
    model: Model quality thresholds and cross-location consistency tests
filterwarnings =
    ignore:vert.*deprecated:DeprecationWarning
    ignore:The set_bad function will be deprecated:PendingDeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
    ignore:The ``noload`` loader strategy is deprecated:sqlalchemy.exc.SADeprecationWarning
    ignore:Operation with range is deprecated:FutureWarning
