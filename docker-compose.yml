services:
  mlflow:
    build:
      context: .
      target: runtime
    container_name: house_price_mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow_experiments/mlflow.db
      --default-artifact-root /app/mlflow_experiments/artifacts
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_experiments:/app/mlflow_experiments
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    container_name: house_price_api
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models/house_price_pipeline.joblib
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./models:/app/models
      - ./config:/app/config:ro
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
